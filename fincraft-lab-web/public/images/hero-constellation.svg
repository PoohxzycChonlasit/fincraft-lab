<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-craft-accent, #ea580c)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--color-action-primary, #0f766e)" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--color-craft-accent, #ea580c)" stop-opacity="0.25" />
      <stop offset="100%" stop-color="var(--color-action-primary, #0f766e)" stop-opacity="0.25" />
    </linearGradient>
  </defs>
  <!-- Background grid dots -->
  <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="currentColor" opacity="0.08" />
  </pattern>
  <rect width="800" height="400" fill="url(#dotGrid)" />

  <!-- Constellation Nodes & Connecting Lines -->
  <path d="M 120 180 L 280 120 L 460 220 L 640 140 L 720 260" stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 280 120 L 340 280 L 460 220 L 560 310" stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Node Cards (Abstract Financial Elements) -->
  <rect x="90" y="155" width="60" height="50" rx="10" fill="url(#grad1)" stroke="currentColor" stroke-opacity="0.15" />
  <circle cx="120" cy="180" r="4" fill="var(--color-craft-accent, #ea580c)" opacity="0.6" />

  <rect x="250" y="95" width="60" height="50" rx="10" fill="url(#grad1)" stroke="currentColor" stroke-opacity="0.15" />
  <circle cx="280" cy="120" r="4" fill="var(--color-action-primary, #0f766e)" opacity="0.6" />

  <rect x="430" y="195" width="60" height="50" rx="10" fill="url(#grad1)" stroke="currentColor" stroke-opacity="0.15" />
  <circle cx="460" cy="220" r="5" fill="var(--color-craft-accent, #ea580c)" opacity="0.8" />

  <rect x="610" y="115" width="60" height="50" rx="10" fill="url(#grad1)" stroke="currentColor" stroke-opacity="0.15" />
  <circle cx="640" cy="140" r="4" fill="var(--color-action-primary, #0f766e)" opacity="0.6" />
</svg>
