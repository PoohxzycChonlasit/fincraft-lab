<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FinCraft Lab mark</title>
  <desc id="desc">Three interlocking rounded geometric modules representing create, combine, and discover.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FA6A0"/>
      <stop offset="1" stop-color="#0F5B5D"/>
    </linearGradient>
  </defs>
  <g>
    <!-- Upper module -->
    <path d="M96 96h224c53 0 96 43 96 96v16H240c-44 0-80 36-80 80v32H96z"
          fill="url(#teal)"/>
    <!-- Lower-left module -->
    <path d="M96 288h144v128H96z" fill="#17324D"/>
    <!-- Lower-right module -->
    <path d="M240 208h176v208H304c-35 0-64-29-64-64z"
          fill="#F28C28"/>
    <!-- Small negative-space notch for a more unique silhouette -->
    <path d="M240 208h64v80h-64z" fill="#FFF9EF"/>
  </g>
</svg>